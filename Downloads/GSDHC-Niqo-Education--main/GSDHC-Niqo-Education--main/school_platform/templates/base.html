<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GSDHC School Platform{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS - Design SaaS Premium -->
    <style>
        :root {
            /* Palette de couleurs strictement respectée */
            --primary-blue: #2563eb;
            --primary-blue-light: #3b82f6;
            --primary-blue-dark: #1d4ed8;
            --success-green: #059669;
            --success-green-light: #10b981;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 8px;
            --border-radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: var(--gray-900);
            background-color: var(--gray-50);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Layout */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--white);
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--gray-300) var(--gray-100);
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-nav::-webkit-scrollbar-track {
            background: var(--gray-100);
        }

        .sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }

        .sidebar-nav::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--gray-200);
        }

        .sidebar-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-blue);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-brand i {
            font-size: 24px;
            color: var(--primary-blue);
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 20px 8px;
            margin-bottom: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: var(--gray-700);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            border-radius: 0;
            transition: all 0.15s ease;
            position: relative;
        }

        .nav-link:hover {
            background-color: var(--gray-50);
            color: var(--primary-blue);
        }

        .nav-link.active {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--primary-blue-light);
        }

        .nav-link i {
            font-size: 18px;
            width: 18px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Topbar */
        .topbar {
            height: 80px;
            background-color: var(--white);
            border-bottom: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .topbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            padding: 0 32px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
        }

        .page-info {
            display: flex;
            flex-direction: column;
        }

        .breadcrumb {
            font-size: 13px;
        }

        .breadcrumb .breadcrumb-item a {
            color: var(--gray-600);
        }

        .breadcrumb .breadcrumb-item.active {
            color: var(--primary-blue);
            font-weight: 500;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-quick-actions {
            display: flex;
            gap: 8px;
        }

        .topbar-separator {
            width: 1px;
            height: 32px;
            background-color: var(--gray-300);
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--gray-900);
            margin: 0;
        }

        .topbar-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-menu-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: none;
            border: none;
            border-radius: var(--border-radius);
            color: var(--gray-700);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .user-menu-btn:hover {
            background-color: var(--gray-100);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 600;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 32px;
            max-width: 100%;
        }

        /* Cards */
        .card {
            background-color: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.15s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            padding: 24px;
            border-bottom: 1px solid var(--gray-200);
            background-color: var(--white);
            border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0 !important;
        }

        .card-body {
            padding: 24px;
        }

        /* Stats Overview */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 48px;
        }

        .stat-card {
            background-color: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--gray-300);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--border-radius);
            background-color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stat-icon i {
            font-size: 20px;
            color: var(--white);
        }

        .stat-content {
            flex: 1;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1;
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Section Headers */
        .section-header {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--gray-900);
            margin: 0 0 8px 0;
        }

        .section-subtitle {
            font-size: 14px;
            color: var(--gray-600);
            margin: 0;
        }

        /* Action Cards */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }

        .action-card {
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-lg);
            background-color: var(--white);
            transition: all 0.15s ease;
            text-decoration: none;
            color: inherit;
        }

        .action-card:hover {
            border-color: var(--primary-blue);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .action-card-header {
            padding: 24px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius);
            background-color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
        }

        .action-icon i {
            font-size: 24px;
        }

        .action-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-900);
            margin: 0;
        }

        .action-subtitle {
            font-size: 14px;
            color: var(--gray-600);
            margin: 4px 0 0 0;
        }

        .action-card-body {
            padding: 24px;
        }

        .action-list {
            display: grid;
            gap: 12px;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            background-color: var(--gray-50);
            text-decoration: none;
            color: var(--gray-700);
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .action-item:hover {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .action-item i {
            font-size: 16px;
            width: 16px;
        }

        /* Buttons */
        .btn {
            border-radius: var(--border-radius);
            font-weight: 500;
            padding: 10px 20px;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
        }

        .btn-primary:hover {
            background-color: var(--primary-blue-dark);
            border-color: var(--primary-blue-dark);
            transform: translateY(-1px);
        }

        .btn-success {
            background-color: var(--success-green);
            border-color: var(--success-green);
        }

        .btn-success:hover {
            background-color: var(--success-green);
            border-color: var(--success-green);
            opacity: 0.9;
        }

        /* Welcome Header */
        .welcome-header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-light) 100%);
            color: var(--white);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .welcome-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .welcome-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .welcome-text {
            flex: 1;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 6px 0;
        }

        .welcome-subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin: 0;
            max-width: 500px;
        }

        .welcome-stats {
            margin-top: 24px;
        }

        .welcome-chart {
            flex-shrink: 0;
            margin-left: 48px;
            position: relative;
        }

        .welcome-chart-image {
            max-width: 220px;
            height: auto;
            opacity: 0.9;
            margin-left: -15px;
            transition: all 0.3s ease;
            animation: gentle-float 4s ease-in-out infinite;
        }

        .welcome-chart-image:hover {
            transform: scale(1.02);
            opacity: 1;
        }

        @keyframes gentle-float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        /* System Status */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background-color: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius);
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .status-icon.success {
            background-color: var(--success-green);
            color: var(--white);
        }

        .status-icon.warning {
            background-color: #f59e0b;
            color: var(--white);
        }

        .status-text h6 {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-900);
            margin: 0 0 2px 0;
        }

        .status-text small {
            font-size: 12px;
            color: var(--gray-600);
        }

        /* Alerts */
        .alert {
            border-radius: var(--border-radius);
            border: none;
            padding: 16px 20px;
        }

        /* Advanced Analytics */
        .analytics-full-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .quick-actions-full {
            margin-top: 32px;
        }

        .analytics-card {
            background-color: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: box-shadow 0.15s ease;
        }

        .analytics-card:hover {
            box-shadow: var(--shadow-md);
        }

        .chart-card {
            height: 100%;
        }

        .analytics-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            background-color: var(--gray-50);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .analytics-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-900);
            margin: 0;
            display: flex;
            align-items: center;
        }

        .analytics-title i {
            color: var(--primary-blue);
        }

        .analytics-controls {
            display: flex;
            gap: 8px;
        }

        .analytics-body {
            padding: 24px;
        }

        /* Enhanced Chart Styles */
        .performance-chart {
            margin-bottom: 16px;
        }

        .chart-svg {
            width: 100%;
            height: 220px;
        }

        .chart-label {
            font-size: 11px;
            fill: var(--gray-500);
            font-weight: 500;
        }

        .data-point {
            opacity: 0;
            animation: fadeInPoint 0.5s ease forwards;
        }

        .data-point:nth-child(1) { animation-delay: 0.1s; }
        .data-point:nth-child(2) { animation-delay: 0.3s; }
        .data-point:nth-child(3) { animation-delay: 0.5s; }
        .data-point:nth-child(4) { animation-delay: 0.7s; }
        .data-point:nth-child(5) { animation-delay: 0.9s; }
        .data-point:nth-child(6) { animation-delay: 1.1s; }
        .data-point:nth-child(7) { animation-delay: 1.3s; }
        .data-point:nth-child(8) { animation-delay: 1.5s; }
        .data-point:nth-child(9) { animation-delay: 1.7s; }

        @keyframes fadeInPoint {
            to {
                opacity: 1;
            }
        }

        .chart-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200);
        }

        .chart-legend {
            display: flex;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--gray-600);
            font-weight: 500;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .chart-stats {
            text-align: right;
        }

        .stat-mini .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .stat-mini .stat-label {
            font-size: 11px;
            color: var(--gray-500);
            margin-top: 2px;
        }

        /* Pie Chart Enhancements */
        .pie-chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .pie-chart {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .pie-center-text {
            font-size: 18px;
            font-weight: 700;
            fill: var(--gray-900);
        }

        .pie-center-label {
            font-size: 12px;
            fill: var(--gray-600);
            font-weight: 500;
        }

        .pie-legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .pie-legend .legend-item {
            justify-content: space-between;
            padding: 8px 0;
        }

        .legend-value {
            font-weight: 600;
            color: var(--gray-900);
        }

        /* Quick Actions Enhancements */
        .quick-actions-grid {
            display: grid;
            gap: 32px;
        }

        .action-category {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--gray-200);
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-radius: var(--border-radius);
            text-decoration: none;
            transition: all 0.15s ease;
            border: 1px solid var(--gray-200);
            background-color: var(--white);
        }

        .action-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-blue);
        }

        .action-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-card:nth-child(1) .action-icon,
        .action-card:nth-child(3) .action-icon {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .action-card:nth-child(2) .action-icon,
        .action-card:nth-child(4) .action-icon {
            background-color: var(--success-green);
            color: var(--white);
        }

        .action-card:nth-child(5) .action-icon,
        .action-card:nth-child(6) .action-icon {
            background-color: var(--gray-100);
            color: var(--gray-700);
        }

        .action-icon i {
            font-size: 18px;
        }

        .action-info {
            flex: 1;
        }

        .action-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 2px;
        }

        .action-subtitle {
            font-size: 12px;
            color: var(--gray-600);
        }

        .action-arrow {
            color: var(--gray-400);
            font-size: 14px;
            transition: color 0.15s ease;
        }

        .action-card:hover .action-arrow {
            color: var(--primary-blue);
        }

        /* Performance Chart */
        .performance-chart {
            margin-bottom: 16px;
        }

        .chart-svg {
            width: 100%;
            height: 200px;
        }

        .chart-label {
            font-size: 11px;
            fill: var(--gray-500);
            font-weight: 500;
        }

        .data-point {
            opacity: 0;
            animation: fadeInPoint 0.5s ease forwards;
        }

        .data-point:nth-child(1) { animation-delay: 0.1s; }
        .data-point:nth-child(2) { animation-delay: 0.2s; }
        .data-point:nth-child(3) { animation-delay: 0.3s; }
        .data-point:nth-child(4) { animation-delay: 0.4s; }
        .data-point:nth-child(5) { animation-delay: 0.5s; }
        .data-point:nth-child(6) { animation-delay: 0.6s; }
        .data-point:nth-child(7) { animation-delay: 0.7s; }
        .data-point:nth-child(8) { animation-delay: 0.8s; }
        .data-point:nth-child(9) { animation-delay: 0.9s; }

        @keyframes fadeInPoint {
            to {
                opacity: 1;
            }
        }

        .chart-legend {
            display: flex;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--gray-600);
            font-weight: 500;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        /* Pie Chart */
        .pie-chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .pie-chart {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .pie-legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* KPI Grid */
        .kpi-grid {
            padding: 0 !important;
        }

        .kpi-item {
            padding: 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .kpi-item:last-child {
            border-bottom: none;
        }

        .kpi-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .kpi-item:nth-child(1) .kpi-icon { background-color: var(--primary-blue); }
        .kpi-item:nth-child(2) .kpi-icon { background-color: var(--success-green); }
        .kpi-item:nth-child(3) .kpi-icon { background-color: #f59e0b; }
        .kpi-item:nth-child(4) .kpi-icon { background-color: var(--primary-blue-light); }

        .kpi-item:nth-child(1) .kpi-icon i,
        .kpi-item:nth-child(2) .kpi-icon i,
        .kpi-item:nth-child(3) .kpi-icon i,
        .kpi-item:nth-child(4) .kpi-icon i {
            color: var(--white);
            font-size: 20px;
        }

        .kpi-content {
            flex: 1;
        }

        .kpi-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1;
            margin-bottom: 4px;
        }

        .kpi-label {
            font-size: 13px;
            color: var(--gray-600);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .kpi-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .kpi-trend.positive {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-green);
        }

        .kpi-trend.neutral {
            background-color: rgba(107, 114, 128, 0.1);
            color: var(--gray-600);
        }

        /* Activity Feed */
        .activity-feed {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .activity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .activity-dot.success { background-color: var(--success-green); }
        .activity-dot.info { background-color: var(--primary-blue); }
        .activity-dot.warning { background-color: #f59e0b; }
        .activity-dot.primary { background-color: var(--primary-blue-light); }

        .activity-content {
            flex: 1;
        }

        .activity-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-900);
            margin-bottom: 2px;
        }

        .activity-meta {
            font-size: 11px;
            color: var(--gray-500);
        }

        /* Enhanced Activity Feed */
        .activity-feed {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px;
            border-radius: var(--border-radius);
            background-color: var(--gray-50);
            transition: background-color 0.15s ease;
            border-left: 4px solid transparent;
        }

        .activity-item:hover {
            background-color: var(--white);
        }

        .activity-icon-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .activity-item:nth-child(1) .activity-icon-wrapper { background-color: var(--success-green); color: var(--white); }
        .activity-item:nth-child(2) .activity-icon-wrapper { background-color: var(--primary-blue); color: var(--white); }
        .activity-item:nth-child(3) .activity-icon-wrapper { background-color: #f59e0b; color: var(--white); }
        .activity-item:nth-child(4) .activity-icon-wrapper { background-color: var(--primary-blue-light); color: var(--white); }
        .activity-item:nth-child(5) .activity-icon-wrapper { background-color: var(--success-green); color: var(--white); }

        .activity-content {
            flex: 1;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .activity-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-900);
        }

        .activity-time {
            font-size: 12px;
            color: var(--gray-500);
            font-weight: 500;
        }

        .activity-description {
            font-size: 13px;
            color: var(--gray-700);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .activity-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .activity-user {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-blue);
        }

        .activity-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .activity-badge.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-green);
        }

        .activity-badge.info {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--primary-blue);
        }

        .activity-badge.warning {
            background-color: rgba(245, 158, 11, 0.1);
            color: #d97706;
        }

        .activity-badge.primary {
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary-blue-light);
        }

        .activity-footer {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200);
            text-align: center;
        }

        /* Enhanced Quick Actions */
        .quick-actions-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-group-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--gray-200);
        }

        .action-group-items {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .action-button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-radius: var(--border-radius);
            text-decoration: none;
            transition: all 0.15s ease;
            border: 1px solid var(--gray-200);
            background-color: var(--white);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .action-button.primary {
            border-left: 4px solid var(--primary-blue);
        }

        .action-button.primary:hover {
            border-color: var(--primary-blue);
            background-color: rgba(37, 99, 235, 0.02);
        }

        .action-button.success {
            border-left: 4px solid var(--success-green);
        }

        .action-button.success:hover {
            border-color: var(--success-green);
            background-color: rgba(16, 185, 129, 0.02);
        }

        .action-button.info {
            border-left: 4px solid #3b82f6;
        }

        .action-button.info:hover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.02);
        }

        .action-button.secondary {
            border-left: 4px solid var(--gray-400);
        }

        .action-button.secondary:hover {
            border-color: var(--gray-400);
            background-color: var(--gray-50);
        }

        .action-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-button.primary .action-icon {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .action-button.success .action-icon {
            background-color: var(--success-green);
            color: var(--white);
        }

        .action-button.info .action-icon {
            background-color: #3b82f6;
            color: var(--white);
        }

        .action-button.secondary .action-icon {
            background-color: var(--gray-100);
            color: var(--gray-700);
        }

        .action-icon i {
            font-size: 16px;
        }

        .action-content {
            flex: 1;
        }

        .action-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 2px;
        }

        .action-description {
            font-size: 12px;
            color: var(--gray-600);
        }

        .action-arrow {
            color: var(--gray-400);
            font-size: 14px;
            transition: color 0.15s ease;
        }

        .action-button:hover .action-arrow {
            color: var(--primary-blue);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 260px;
            }
            .main-content {
                margin-left: 260px;
            }
            .advanced-stats-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 1024px) {
            .analytics-grid {
                grid-template-columns: 1fr 1fr;
            }
            .analytics-bottom-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
            }
            .topbar {
                height: 70px;
                padding: 0 16px;
            }
            .content-area {
                padding: 16px;
            }

            /* Stats overview responsive */
            .stats-overview {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            /* Analytics responsive */
            .analytics-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .analytics-bottom-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            /* Welcome header responsive */
            .welcome-header {
                padding: 24px;
            }
            .welcome-title {
                font-size: 24px;
            }
            .welcome-content {
                flex-direction: column;
                text-align: center;
                gap: 24px;
            }
            .welcome-chart {
                margin-left: 0;
            }
            .welcome-chart-image {
                max-width: 200px;
            }

            /* KPI responsive */
            .kpi-item {
                padding: 16px;
            }
            .kpi-value {
                font-size: 20px;
            }

            /* Activity feed responsive */
            .activity-item {
                gap: 10px;
            }
            .activity-text {
                font-size: 13px;
            }

            /* Quick actions responsive */
            .quick-actions-panel {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .action-button {
                padding: 16px 12px;
            }
        }

        @media (max-width: 480px) {
            .stats-overview {
                grid-template-columns: 1fr;
            }

            .welcome-header {
                padding: 20px;
            }

            .welcome-title {
                font-size: 20px;
            }
        }

        /* Utilities */
        .text-muted {
            color: var(--gray-600) !important;
        }

        .bg-light {
            background-color: var(--gray-50) !important;
        }

        .border {
            border: 1px solid var(--gray-200) !important;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        {% include 'dashboard/admin/sidebar.html' %}

        <!-- Main Content -->
        <div class="main-content">
            <!-- Topbar -->
            {% include 'dashboard/admin/topbar.html' %}

            <!-- Content Area -->
            <main class="content-area">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}success{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
